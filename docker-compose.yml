services:
  goodnav:
    build:
      context: .
      dockerfile: Dockerfile
    image: vlnverse-goodnav:latest
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all
      - VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/nvidia_icd.json
      - DISPLAY=${DISPLAY:-}
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
    volumes:
      # ── Isaac Sim cache (persisted between runs) ──────────────────
      - isaac_ov_cache:/root/.cache/ov
      - isaac_gl_cache:/root/.cache/nvidia/GLCache
      - isaac_compute_cache:/root/.nv/ComputeCache
      # ── Demo code + scenes ────────────────────────────────────────
      - .:/workspace/IAmGoodNavigator
      # ── X11 socket for host-display forwarding ────────────────────
      - /tmp/.X11-unix:/tmp/.X11-unix
      # ── Result output ─────────────────────────────────────────────
      - goodnav_results:/results
    ports:
      - "5900:5900"   # VNC (direct)
      - "6080:6080"   # noVNC (browser)
    ipc: host
    stdin_open: true
    tty: true

volumes:
  isaac_ov_cache:
  isaac_gl_cache:
  isaac_compute_cache:
  goodnav_results:
